<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>

      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
    }

    .container {
      margin-top: 100px;
    }

    .display-4 {

      color: #f39c12;
    }

    .lead {
      font-size: 1.2rem;
      font-weight: 400;
      margin-bottom: 30px;
    }

    .btn-custom {
      background-color: #1abc9c;
      color: white;
      font-weight: 600;
      border-radius: 50px;
      padding: 15px 40px;

      transition: background-color 0.3s ease;

    .btn-custom:hover {
