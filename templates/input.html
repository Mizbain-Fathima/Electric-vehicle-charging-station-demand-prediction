<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Predict EV Demand</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .form-container {
      margin-top: 60px;
      background-color: #1e293b;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
    }
    .form-label {
      font-weight: 500;
    }
    .form-control {
      border-radius: 10px;
    }
    .btn-custom {
      background-color: #0ea5e9;
      color: white;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
    }
    .btn-custom:hover {
      background-color: #0284c7;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="text-center">
      <h1 class="mt-5 mb-4">🔌 EV Charging Demand Prediction</h1>
    </div>
    <div class="form-container mx-auto" style="max-width: 700px;">
      <form action="/predict" method="POST">
        <div class="mb-3">
          <label class="form-label">🔋 Battery Capacity (kWh)</label>
          <input type="number" class="form-control" name="Battery_Capacity_kWh" required>
        </div>

        <div class="mb-3">
          <label class="form-label">⚡ State of Charge (%)</label>
          <input type="number" class="form-control" name="State_of_Charge_%" required>
        </div>

        <div class="mb-3">
          <label class="form-label">🚗 Energy Consumption Rate (kWh/km)</label>
          <input type="number" step="0.01" class="form-control" name="Energy_Consumption_Rate_kWh_per_km" required>
        </div>

        <div class="mb-3">
          <label class="form-label">📍 Distance to Destination (km)</label>
          <input type="number" class="form-control" name="Distance_to_Destination_km" required>
        </div>

        <div class="mb-3">
          <label class="form-label">⚙️ Charging Rate (kW)</label>
          <input type="number" class="form-control" name="Charging_Rate_kW" required>
        </div>

        <div class="mb-3">
          <label class="form-label">🏢 Station Capacity (EV)</label>
          <input type="number" class="form-control" name="Station_Capacity_EV" required>
        </div>

        <div class="mb-3">
          <label class="form-label">🌡️ Temperature (°C)</label>
          <input type="number" step="0.1" class="form-control" name="Temperature_C" required>
        </div>

        <div class="mb-3">
          <label class="form-label">⏰ Hour of Day</label>
          <input type="number" min="0" max="23" class="form-control" name="hour" required>
        </div>

        <div class="mb-3">
          <label class="form-label">📅 Day of Week (0 = Mon, 6 = Sun)</label>
          <input type="number" min="0" max="6" class="form-control" name="day_of_week" required>
        </div>

        <div class="mb-4">
          <label class="form-label">🌦️ Weather Condition</label>
          <input type="text" class="form-control" name="Weather_Conditions" placeholder="e.g., Clear, Rain, Fog" required>
        </div>

        <div class="text-center">
          <button type="submit" class="btn btn-custom">🚀 Predict Charging Load</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
